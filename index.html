<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" href="data:image/svg+xml,svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
  <meta charset="UTF-8">
  <title>CeliaCheck</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fraunces:ital@1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
   <!-- HERO -->
  <header class="cc-hero">
    <div class="cc-hero-bg">🌿</div>
    <div class="cc-logo">Celia<em>Check</em></div>
    <p class="cc-tagline">"Encontrá alimentos y lugares aptos para vos."</p>
  </header>

<div class="cc-wrapper">
 
  <!-- HERO -->

  <!-- ALIMENTACIÓN -->
  <section class="cc-section">
    <p class="cc-sec-title">¿Cuál es tu alimentación?</p>
   <div class="cc-profile-grid">
  
     <button class="cc-profile-btn" onclick="elegirPerfil(this, 'celiaco')">
        <i>🌾</i> Celiaco
      </button>
      <button class="cc-profile-btn" onclick="elegirPerfil(this, 'vegetariano')">
        <i>🥗</i> Vegetariano
      </button>
      <button class="cc-profile-btn" onclick="elegirPerfil(this, 'vegano')">
        <i>🌱</i> Vegano
      </button>
    </div>
  </section>



  

  <!-- VERIFICADOR -->
  <div class="cc-verificador">
    <p class="cc-sec-title">Verificador de alimentos</p>
    <p class="cc-sub">Seleccioná tu perfil y escribí un alimento.</p>
 <!-- Escáner para celular -->
    <div class="cc-scan-mobile">
      <button class="cc-scan-btn" onclick="alert('Acá vamos a abrir la cámara')">
        <i>📷</i>
        <span>Escanear código de barras</span>
      </button>
    </div>

    <!-- Input manual para compu -->
    <div class="cc-scan-desktop">
  <input type="text" id="codigo-barras" placeholder="Escribí el código de barras del producto..."
  onkeydown="if(event.key==='Enter') buscarPorInput()">
  <button class="cc-submit" onclick="buscarPorInput()">Buscar</button>
</div>
  </div>
    
    

  

  <!-- MAPA -->
  <section class="cc-section">
    <p class="cc-sec-title">Encontrá lo que buscás</p>
    <div id="map" style="height: 400px; border-radius: 12px; margin: 0 1.5rem 1.5rem;"></div>
    
  <div class="cc-divider"></div>

  <!-- FORMULARIO -->
  <section class="cc-section" style="padding-bottom: 1.5rem">
    <p class="cc-sec-title">Contanos tu experiencia</p>
    <div class="cc-form">
      <input type="text" placeholder="Tu nombre">
      <textarea placeholder="Escribí tu experiencia acá..."></textarea>
      <button class="cc-submit" onclick="enviarFormulario()">Enviar →</button>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="cc-footer">
    <div class="cc-footer-logo">Celia<em>Check</em></div>
    <div class="cc-footer-links">
      <i title="Instagram">📸</i>
      <i title="TikTok">🎵</i>
      <i title="Email">✉️</i>
    </div>
  </footer>

</div>
<!-- Semáforo -->
<!-- Semáforo -->
<div class="cc-semaforo-overlay" id="semaforo-overlay" onclick="cerrarSemaforoYMostrarResultado()">
  <div class="cc-semaforo-box">
    <div class="cc-luz cc-luz-roja" id="luz-roja"></div>
    <div class="cc-luz cc-luz-amarilla" id="luz-amarilla"></div>
    <div class="cc-luz cc-luz-verde" id="luz-verde"></div>
  </div>
  <p class="cc-semaforo-texto" id="semaforo-texto">Analizando producto...</p>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
